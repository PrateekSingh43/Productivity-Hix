<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Guard — ProductiveHix</title>
  <style>
    :root {
      --bg-canvas: #07080d;
      --bg-card: #0f121d;
      --border: #1a2030;
      --border-focus: #3b4562;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.2);
      --amber: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    .container {
      max-width: 480px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 80px var(--accent-glow);
      text-align: center;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .shield-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: var(--accent);
      margin-bottom: 20px;
    }

    .kicker {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .session-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      color: var(--amber);
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 8px;
      padding: 6px 12px;
      margin: 12px 0 16px;
      font-weight: 500;
    }

    p.description {
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .destination-preview {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 24px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: ui-monospace, monospace;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 13.5px;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 10px 18px;
      font-size: 13px;
    }

    .btn-secondary:hover {
      border-color: var(--border-focus);
      background: rgba(255, 255, 255, 0.04);
    }

    .btn-ghost {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      padding: 6px;
      margin-top: 4px;
      font-weight: 500;
    }

    .btn-ghost:hover {
      color: var(--text-main);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="shield-badge">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>

    <div class="kicker">Focus Guard Active</div>
    <h1>3 Tab Limit Reached</h1>

    <div class="session-banner" id="session-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <span id="session-title">Active Focus Session</span>
    </div>

    <p class="description">
      You are in an intentional focus block. To maintain high cognitive momentum and eliminate tab sprawl, your browser is limited to 3 active tabs.
    </p>

    <div class="destination-preview" id="dest-preview" title="Target destination">
      <span>Target:</span>
      <span id="dest-url" style="color: var(--text-main);">https://...</span>
    </div>

    <div class="actions">
      <button class="btn-primary" id="btn-swap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="17 1 21 5 17 9"/>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <polyline points="7 23 3 19 7 15"/>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
        Swap with Oldest Inactive Tab
      </button>

      <button class="btn-secondary" id="btn-close">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
        Return to Focus (Close this Tab)
      </button>

      <button class="btn-ghost" id="btn-allow">
        Allow tab anyway (Temporary bypass)
      </button>
    </div>
  </div>

  <script type="module" src="focus-guard.js"></script>
</body>
</html>
