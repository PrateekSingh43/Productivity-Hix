<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProductiveHix</title>
    <style>
      :root, [data-theme="dark"] {
        color-scheme: dark;
        --bg-canvas: #09090b;
        --bg-surface: #111115;
        --bg-surface-elevated: #16161c;
        --bg-secondary: #131318;
        --bg-tertiary: #1a1a22;
        --bg-subtle: rgba(255, 255, 255, 0.04);
        --bg-active: rgba(255, 255, 255, 0.08);
        --border-subtle: #23232d;
        --border-default: #30303d;
        --border-hover: #424250;
        --border-strong: #525262;
        --text-primary: #f7f7fb;
        --text-secondary: #c0bfca;
        --text-muted: #858493;
        --btn-primary-bg: #f7f7fb;
        --btn-primary-text: #09090b;
        --btn-primary-border: rgba(255, 255, 255, 0.88);
        --btn-primary-hover-bg: #ffffff;
        --btn-primary-shadow: 0 1px 2px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        --accent-primary: #3b82f6;
        --accent-hover: #60a5fa;
        --accent-subtle: rgba(59, 130, 246, 0.10);
        --accent-border: rgba(59, 130, 246, 0.24);
        --success: #52d397;
        --success-subtle: rgba(82, 211, 151, 0.12);
        --success-border: rgba(82, 211, 151, 0.28);
        --warning: #f6c76c;
        --warning-subtle: rgba(246, 199, 108, 0.12);
        --warning-border: rgba(246, 199, 108, 0.28);
        --danger: #fb7185;
        --danger-subtle: rgba(251, 113, 133, 0.12);
        --danger-border: rgba(251, 113, 133, 0.28);
        --amber: var(--warning);
        --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.04);
        --shadow-overlay: 0 16px 36px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
        --scrollbar-thumb: rgba(255, 255, 255, 0.26);
        --scrollbar-thumb-hover: rgba(255, 255, 255, 0.46);
      }

      [data-theme="light"] {
        color-scheme: light;
        --bg-canvas: #ffffff;
        --bg-surface: #ffffff;
        --bg-surface-elevated: #f8fafc;
        --bg-secondary: #f4f4f5;
        --bg-tertiary: #e4e4e7;
        --bg-subtle: rgba(0, 0, 0, 0.035);
        --bg-active: rgba(0, 0, 0, 0.07);
        --border-subtle: rgba(0, 0, 0, 0.08);
        --border-default: rgba(0, 0, 0, 0.14);
        --border-hover: rgba(0, 0, 0, 0.26);
        --border-strong: rgba(0, 0, 0, 0.38);
        --text-primary: #09090b;
        --text-secondary: #52525b;
        --text-muted: #71717a;
        --btn-primary-bg: #09090b;
        --btn-primary-text: #ffffff;
        --btn-primary-border: #09090b;
        --btn-primary-hover-bg: #18181b;
        --btn-primary-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
        --accent-primary: #2563eb;
        --accent-hover: #1d4ed8;
        --accent-subtle: rgba(37, 99, 235, 0.08);
        --accent-border: rgba(37, 99, 235, 0.20);
        --success: #059669;
        --success-subtle: rgba(5, 150, 105, 0.10);
        --success-border: rgba(5, 150, 105, 0.25);
        --warning: #d97706;
        --warning-subtle: rgba(217, 119, 6, 0.10);
        --warning-border: rgba(217, 119, 6, 0.25);
        --danger: #e11d48;
        --danger-subtle: rgba(225, 29, 72, 0.10);
        --danger-border: rgba(225, 29, 72, 0.25);
        --amber: var(--warning);
        --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(0, 0, 0, 0.07);
        --shadow-overlay: 0 14px 32px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.1);
        --scrollbar-thumb: rgba(0, 0, 0, 0.24);
        --scrollbar-thumb-hover: rgba(0, 0, 0, 0.42);
      }

      @media (prefers-color-scheme: light) {
        [data-theme="system"] {
          color-scheme: light;
          --bg-canvas: #ffffff;
          --bg-surface: #ffffff;
          --bg-surface-elevated: #f8fafc;
          --bg-secondary: #f4f4f5;
          --bg-tertiary: #e4e4e7;
          --bg-subtle: rgba(0, 0, 0, 0.035);
          --bg-active: rgba(0, 0, 0, 0.07);
          --border-subtle: rgba(0, 0, 0, 0.08);
          --border-default: rgba(0, 0, 0, 0.14);
          --border-hover: rgba(0, 0, 0, 0.26);
          --border-strong: rgba(0, 0, 0, 0.38);
          --text-primary: #09090b;
          --text-secondary: #52525b;
          --text-muted: #71717a;
          --btn-primary-bg: #09090b;
          --btn-primary-text: #ffffff;
          --btn-primary-border: #09090b;
          --btn-primary-hover-bg: #18181b;
          --btn-primary-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
          --accent-primary: #2563eb;
          --accent-hover: #1d4ed8;
          --accent-subtle: rgba(37, 99, 235, 0.08);
          --accent-border: rgba(37, 99, 235, 0.20);
          --success: #059669;
          --success-subtle: rgba(5, 150, 105, 0.10);
          --success-border: rgba(5, 150, 105, 0.25);
          --warning: #d97706;
          --warning-subtle: rgba(217, 119, 6, 0.10);
          --warning-border: rgba(217, 119, 6, 0.25);
          --danger: #e11d48;
          --danger-subtle: rgba(225, 29, 72, 0.10);
          --danger-border: rgba(225, 29, 72, 0.25);
          --amber: var(--warning);
          --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(0, 0, 0, 0.07);
          --shadow-overlay: 0 14px 32px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.1);
          --scrollbar-thumb: rgba(0, 0, 0, 0.24);
          --scrollbar-thumb-hover: rgba(0, 0, 0, 0.42);
        }
      }

      * { box-sizing: border-box; }
      html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: var(--bg-canvas);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      body {
        width: 390px;
        height: 580px;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: var(--bg-canvas);
        color: var(--text-primary);
        user-select: none;
        transition: background-color 200ms cubic-bezier(0.16, 1, 0.3, 1), color 200ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      body.standalone {
        width: 100vw;
        height: 100vh;
        max-width: 100vw;
        max-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-canvas);
      }
      button { border: 0; font: inherit; cursor: pointer; outline: none; }
      button:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 1px; }

      #root {
        width: 390px;
        height: 580px;
        max-height: 580px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      body.standalone #root {
        width: 100%;
        max-width: 520px;
        height: 100%;
        max-height: 700px;
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        box-shadow: var(--shadow-overlay);
      }
      @media (max-width: 540px) {
        body.standalone #root {
          max-width: 100vw;
          max-height: 100vh;
          border-radius: 0;
          border: none;
          box-shadow: none;
        }
      }
      .app-shell {
        width: 100%;
        height: 100%;
        max-height: 580px;
        display: flex;
        flex-direction: column;
        padding: 12px 14px 8px;

        box-sizing: border-box;
        overflow: hidden;
        background: var(--bg-canvas);
      }
      body.standalone .app-shell {
        width: 100%;
        height: 100vh;
        max-height: 100vh;
      }

      /* Header */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 32px;
        flex-shrink: 0;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--border-subtle);
      }
      .brand-mark {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 5px;
        overflow: hidden;
        background: var(--bg-subtle);
      }
      .brand {
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      .eyebrow, .section-kicker {
        color: var(--text-muted);
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      /* Persistent Top Nav: 4 tabs with smooth sliding pill indicator */
      .top-nav {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 3px;
        margin: 10px 0 10px;
        padding: 3px;
        border: 1px solid var(--border-subtle);
        border-radius: 9px;
        background: var(--bg-surface);
        flex-shrink: 0;
        position: relative;
      }
      .nav-item {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 5px;
        padding: 6px 4px;
        border-radius: 6px;
        color: var(--text-secondary);
        background: transparent;
        font-size: 11px;
        font-weight: 500;
        transition: color 150ms ease, background-color 150ms cubic-bezier(0.16, 1, 0.3, 1), transform 100ms ease;
      }
      .nav-item:hover {
        color: var(--text-primary);
        background: var(--bg-subtle);
      }
      .nav-item.selected {
        color: var(--text-primary);
        background: var(--bg-active);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12), inset 0 0 0 1px var(--border-default);
        font-weight: 600;
      }
      .nav-item:active {
        transform: scale(0.97);
      }

      /* Controlled internal scrollable content area (visible, smooth Linear scrollbar) */
      .content {
        flex: 1 1 0%;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-right: 5px;
        padding-bottom: 12px;
        scrollbar-width: thin;
        scrollbar-color: var(--scrollbar-thumb) transparent;
        animation: fadeInSlide 150ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .content::-webkit-scrollbar { width: 6px; }
      .content::-webkit-scrollbar-track { background: transparent; }
      .content::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 6px; }
      .content::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }

      /* Cards & Surfaces (Linear aesthetic: flat, hairline borders, no unnecessary nesting) */
      .hero-card, .task-card, .focus-card, .review-card, .settings-card, .diagnostics, .reflect-card {
        border: 1px solid var(--border-subtle);
        border-radius: 10px;
        background: var(--bg-surface);
        box-shadow: var(--shadow-card);
        transition: border-color 150ms ease, background-color 200ms ease;
      }
      .hero-card { padding: 12px 14px; }

      .section-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 8px;
        padding: 2px 1px 0;
      }
      .section-heading.compact { align-items: flex-start; }
      h1 { margin: 2px 0 0; color: var(--text-primary); font-size: 15.5px; font-weight: 600; letter-spacing: -0.02em; }

      .text-button {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 0;
        color: var(--text-secondary);
        background: transparent;
        font-size: 10.5px;
        font-weight: 500;
        transition: color 150ms ease;
      }
      .text-button:hover { color: var(--text-primary); }

      /* Metric Grid (Linear tiled layout with 1px hairline dividing borders) */
      .metric-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border: 1px solid var(--border-subtle);
        border-radius: 9px;
        background: var(--bg-surface);
        overflow: hidden;
      }
      .metric-card {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 9px 8px;
        border-right: 1px solid var(--border-subtle);
        background: transparent;
      }
      .metric-card:last-child { border-right: none; }
      .metric-icon { color: var(--text-muted); }
      .metric-card strong { color: var(--text-primary); font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .metric-card span { color: var(--text-muted); font-size: 9.5px; font-weight: 500; }

      .task-card { padding: 12px 14px; }
      .task-card h2, .focus-details h2, .review-card h2 {
        margin: 4px 0 2px;
        color: var(--text-primary);
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      /* Button System (Linear Design System: High-contrast CTA, subtle status tints, hairline borders) */
      .primary-button, .secondary-button, .warning-button, .success-button, .danger-button, .ghost-button, .filter-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 11.5px;
        font-weight: 550;
        letter-spacing: -0.01em;
        cursor: pointer;
        transition: transform 80ms cubic-bezier(0.16, 1, 0.3, 1), background-color 120ms ease, border-color 120ms ease, color 120ms ease, box-shadow 120ms ease;
        white-space: nowrap;
        user-select: none;
        line-height: 1.4;
      }
      .primary-button:active:not(:disabled),
      .secondary-button:active:not(:disabled),
      .warning-button:active:not(:disabled),
      .success-button:active:not(:disabled),
      .danger-button:active:not(:disabled),
      .ghost-button:active:not(:disabled),
      .filter-toggle:active:not(:disabled) {
        transform: scale(0.98);
      }
      /* Linear signature monochrome high-contrast primary CTA */
      .primary-button {
        color: var(--btn-primary-text);
        background: var(--btn-primary-bg);
        border: 1px solid var(--btn-primary-border);
        box-shadow: var(--btn-primary-shadow);
        font-weight: 600;
      }
      .primary-button:hover:not(:disabled) {
        background: var(--btn-primary-hover-bg);
        transform: translateY(-0.5px);
      }
      .primary-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      /* Secondary neutral button */
      .secondary-button {
        color: var(--text-primary);
        border: 1px solid var(--border-default);
        background: var(--bg-surface-elevated);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      }
      .secondary-button:hover:not(:disabled) {
        background: var(--bg-active);
        border-color: var(--border-hover);
        color: var(--text-primary);
      }
      .secondary-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      /* Status Action: Focus / Success button */
      .success-button {
        color: var(--success);
        background: var(--success-subtle);
        border: 1px solid var(--success-border);
      }
      .success-button:hover:not(:disabled) {
        background: rgba(82, 211, 151, 0.22);
        border-color: rgba(82, 211, 151, 0.45);
      }
      .success-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      /* Status Action: Pause / Resume / Warning button */
      .warning-button {
        color: var(--warning);
        background: var(--warning-subtle);
        border: 1px solid var(--warning-border);
      }
      .warning-button:hover:not(:disabled) {
        background: rgba(246, 199, 108, 0.22);
        border-color: rgba(246, 199, 108, 0.45);
      }
      .warning-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      /* Status Action: Danger / Discard / Abort */
      .danger-button {
        color: var(--danger);
        border: 1px solid var(--danger-border);
        background: var(--danger-subtle);
      }
      .danger-button:hover:not(:disabled) {
        background: rgba(251, 113, 133, 0.22);
        border-color: rgba(251, 113, 133, 0.45);
        color: #fda4af;
      }
      .danger-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .danger-button.small { margin: 0; padding: 4px 8px; font-size: 10.5px; }
      /* Linear Filter Toggle Controls (No background fill by default, clean hairline border) */
      .filter-toggle {
        padding: 5px 8px;
        background: transparent;
        border: 1px solid var(--border-default);
        border-radius: 6px;
        color: var(--text-secondary);
        font-size: 11px;
        font-weight: 500;
      }
      .filter-toggle:hover:not(:disabled) {
        border-color: var(--border-hover);
        color: var(--text-primary);
        background: var(--bg-subtle);
      }
      .filter-toggle.active {
        border-color: var(--border-strong);
        color: var(--text-primary);
        background: var(--bg-active);
        font-weight: 600;
      }
      .ghost-button, .text-button {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        border-radius: 5px;
        color: var(--text-secondary);
        background: transparent;
        border: 1px solid transparent;
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
        transition: color 120ms ease, background-color 120ms ease, border-color 120ms ease;
      }
      .ghost-button:hover:not(:disabled), .text-button:hover:not(:disabled) {
        color: var(--text-primary);
        background: var(--bg-subtle);
        border-color: var(--border-subtle);
      }
      .wide, .full { width: 100%; }

      /* Focus View Layout */
      .focus-card { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
      .focus-timer-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        background: var(--bg-subtle);
        border: 1px solid var(--border-default);
        border-radius: 9px;
      }
      .focus-timer-box strong {
        font-size: 26px;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-feature-settings: "tnum";
        font-variant-numeric: tabular-nums;
        color: var(--text-primary);
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .metric-card strong {
        color: var(--text-primary);
        font-size: 13.5px;
        font-weight: 600;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-feature-settings: "tnum";
        font-variant-numeric: tabular-nums;
      }

      /* Settings & Diagnostics */
      .settings-card { padding: 2px 12px; }
      .setting-row { display: flex; align-items: center; gap: 10px; min-height: 50px; border-bottom: 1px solid var(--border-subtle); }
      .setting-row:last-child { border-bottom: 0; }
      .setting-icon { display: grid; width: 26px; height: 26px; place-items: center; color: var(--text-secondary); border-radius: 6px; background: var(--bg-subtle); flex-shrink: 0; }
      .setting-copy { display: grid; flex: 1; gap: 2px; min-width: 0; }
      .setting-copy strong { color: var(--text-primary); font-size: 11.5px; font-weight: 550; }
      .setting-copy span, .muted-label { color: var(--text-muted); font-size: 10px; }

      /* Diagnostics */
      .diagnostics { padding: 12px; }
      .diagnostic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0; }
      .diagnostic-grid.three-col { grid-template-columns: repeat(3, 1fr); }
      .diagnostic-grid span { display: grid; gap: 2px; color: var(--text-muted); font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.08em; }
      .diagnostic-grid strong { color: var(--text-primary); font-size: 11.5px; letter-spacing: 0; text-transform: none; }
      .diag-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border-subtle); font-size: 10.5px; }
      .diag-row:last-child { border-bottom: 0; }
      .diag-label { color: var(--text-secondary); }
      .diag-value { color: var(--text-primary); font-weight: 550; font-family: ui-monospace, monospace; font-size: 10px; }

      /* Status Pills */
      .status-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 999px; font-size: 9.5px; font-weight: 600; }
      .status-pill.good { color: var(--success); background: var(--success-subtle); border: 1px solid rgba(16, 185, 129, 0.25); }
      .status-pill.warn { color: var(--warning); background: var(--warning-subtle); border: 1px solid rgba(245, 158, 11, 0.25); }
      .status-pill.bad { color: var(--danger); background: var(--danger-subtle); border: 1px solid rgba(244, 63, 94, 0.25); }
      .live-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 8px rgba(16, 185, 129, 0.8);
        animation: pulseLive 2s infinite ease-in-out;
      }

      .icon-button { display: grid; padding: 4px; place-items: center; color: var(--text-secondary); border-radius: 6px; background: transparent; transition: background 150ms ease, color 150ms ease; }
      .icon-button:hover { background: var(--bg-active); color: var(--text-primary); }

      .skeleton {
        border-radius: 5px;
        background: linear-gradient(90deg, var(--bg-subtle), var(--bg-active), var(--bg-subtle));
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }
      .metric-value { width: 50px; height: 16px; }
      .metric-label { width: 38px; height: 9px; }
      .task-title { width: 70%; height: 16px; margin: 6px 0 5px; }
      .task-meta { width: 45%; height: 10px; }

      .footer { display: flex; justify-content: center; align-items: center; gap: 5px; padding-top: 6px; color: var(--text-muted); font-size: 9.5px; flex-shrink: 0; }

      @keyframes fadeInSlide {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulseLive {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.25); opacity: 0.75; }
      }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
