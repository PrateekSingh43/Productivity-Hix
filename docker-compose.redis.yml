name: productivehix-redis

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - productivehix-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8001:8081"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  productivehix-redis-data:
